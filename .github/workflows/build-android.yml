name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Build_Android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '17'

      - name: Check Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Rename APK with version
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          cp build/app/outputs/apk/debug/*.apk result/venera-android-$APP_VERSION.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: venera-android-apk
          path: result/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Venera Android ${{ github.ref_name }}
          body: |
            ## Venera Android - M3 Expressive
            
            自动构建版本: ${{ github.ref_name }}
            
            ### 配色风格
            - Expressive (默认) — FlexTones.vivid 全高饱和度
            - Tonal Spot — 标准 M3
            - Vibrant — 鲜艳背景
            - Monochromatic — 单色极简
            - Neutral — 柔和低饱和
            - Content — 内容区色彩丰富
          files: result/*.apk
